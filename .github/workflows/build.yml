name: build

# Builds retrobox-emulationstation (.deb and .rpm) from batocera-emulationstation
# plus patches/*.patch, installs each package in a clean container, and
# publishes a GitHub release.
#
#   - every two months, on the 13th (Jan, Mar, May, Jul, Sep, Nov): builds the
#     latest commit of upstream master. If upstream and this repo are unchanged
#     since the last release, the run stops after `resolve`. If a patch stops
#     applying, an issue is opened.
#   - manual (Actions -> build -> Run workflow): whenever you need it, with an
#     optional ref (branch, tag or commit) of upstream to build instead.
#   - push to main / pull request: rebuilds when patches or packaging change
#     (pull requests build and test, they never publish).
on:
  schedule:
    - cron: '17 4 13 1,3,5,7,9,11 *'
  workflow_dispatch:
    inputs:
      es_ref:
        description: 'batocera-emulationstation ref to build (branch, tag or commit)'
        default: master
        required: false
      publish:
        description: 'Publish a release when everything passes'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['patches/**', 'scripts/**', 'packaging/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['patches/**', 'scripts/**', 'packaging/**', 'tests/**', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/batocera-linux/batocera-emulationstation.git

jobs:
  # Resolve what to build and stop early if there is nothing new or the
  # patches no longer apply (cheap: no containers involved).
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      stamp: ${{ steps.r.outputs.stamp }}
      tag: ${{ steps.r.outputs.tag }}
      skip: ${{ steps.r.outputs.skip }}
      publish: ${{ steps.r.outputs.publish }}
      screenscraper: ${{ steps.r.outputs.screenscraper }}
      matrix: ${{ steps.m.outputs.matrix }}
      distros: ${{ steps.m.outputs.distros }}
    steps:
      - uses: actions/checkout@v4

      # Latest Debian stable, last two Ubuntu LTS, last two Fedora: resolved on
      # every run, so the workflow never needs editing when one is released.
      - name: Resolve distributions
        id: m
        run: scripts/resolve-matrix.py

      - name: Resolve upstream commit and release tag
        id: r
        env:
          INPUT_REF: ${{ inputs.es_ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ steps.m.outputs.matrix }}
          SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-master}"
          # Only whether the login exists matters here, never its value.
          screenscraper=0
          if [[ -n "${SCREENSCRAPER_DEV_LOGIN:-}" ]]; then screenscraper=1; fi
          scripts/fetch.sh --no-patch --ref "${ref}" "${RUNNER_TEMP}/upstream"
          # shellcheck source=scripts/common.sh
          . scripts/common.sh
          es_snapshot "${RUNNER_TEMP}/upstream"
          # Everything that influences the result besides upstream itself,
          # including the set of distributions (a new release means a new build).
          inputs_hash="$({ cat patches/*.patch scripts/*.sh scripts/*.py licenses/*.txt packaging/copyright \
            packaging/*.txt packaging/deb/* packaging/rpm/*; printf '%s' "${MATRIX}"; printf 'screenscraper=%s' "${screenscraper}"; } | sha256sum | cut -c1-8)"
          tag="build-${ES_STAMP}-${ES_SHA}-${inputs_hash}"

          publish=false
          case "${GITHUB_EVENT_NAME}" in
            schedule|push) publish=true ;;
            workflow_dispatch) publish="${INPUT_PUBLISH:-true}" ;;
          esac

          skip=false
          if [[ "${publish}" == true ]] && gh release view "${tag}" >/dev/null 2>&1; then
            skip=true
          fi
          {
            echo "sha=${ES_SHA_FULL}"
            echo "stamp=${ES_STAMP}"
            echo "tag=${tag}"
            echo "skip=${skip}"
            echo "publish=${publish}"
            echo "screenscraper=${screenscraper}"
          } >> "${GITHUB_OUTPUT}"
          echo "upstream ${ES_SHA_FULL} (${ES_STAMP} UTC), tag ${tag}, skip=${skip}, publish=${publish}, screenscraper=${screenscraper}"

      - name: Check that the patches apply
        if: steps.r.outputs.skip != 'true'
        env:
          ES_SHA: ${{ steps.r.outputs.sha }}
        run: scripts/fetch.sh --ref "${ES_SHA}" "${RUNNER_TEMP}/check"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Bootstrap (git)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
          else
            dnf install -y git
          fi

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: scripts/install-build-deps.sh

      - name: Fetch upstream and apply patches
        env:
          ES_SHA: ${{ needs.resolve.outputs.sha }}
        run: scripts/fetch.sh --ref "${ES_SHA}" work/src

      # The secret is masked as a whole by GitHub; mask its two values too, in
      # case a compiler error prints the command line with the login in it.
      - name: Mask the ScreenScraper login
        env:
          SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
        run: |
          [[ -n "${SCREENSCRAPER_DEV_LOGIN}" ]] || exit 0
          IFS='&' read -ra parts <<<"${SCREENSCRAPER_DEV_LOGIN}"
          for part in "${parts[@]}"; do
            echo "::add-mask::${part#*=}"
          done

      - name: Build
        env:
          MICROARCH: ${{ matrix.microarch }}
          SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
        run: scripts/build.sh work/src

      - name: Package
        env:
          PKG_REVISION: ${{ github.run_number }}
          KIND: ${{ matrix.kind }}
          MICROARCH: ${{ matrix.microarch }}
        run: scripts/build-"${KIND}".sh work/src dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/**/*.rpm
          if-no-files-found: error

  # Install each package in a clean container, which proves that its
  # dependencies resolve from the distro repositories alone.
  test:
    needs: [resolve, build]
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: pkg

      - name: Install and check
        env:
          GLOB: ${{ matrix.glob }}
          MICROARCH: ${{ matrix.microarch }}
          EXPECT_SCREENSCRAPER: ${{ needs.resolve.outputs.screenscraper }}
        run: |
          file="$(find pkg -name "${GLOB}" | head -n1)"
          tests/smoke.sh "${file}"

  publish:
    needs: [resolve, build, test]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          STAMP: ${{ needs.resolve.outputs.stamp }}
          REPO: ${{ github.repository }}
          DISTROS: ${{ needs.resolve.outputs.distros }}
          SCREENSCRAPER: ${{ needs.resolve.outputs.screenscraper }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' \) | sort)
          printf '%s\n' "${files[@]}"
          # SHA256SUMS lists every package by bare file name; the installer at
          # https://retroboxproject.github.io verifies downloads against it.
          sums_dir="$(mktemp -d)"
          for f in "${files[@]}"; do
            (cd "$(dirname "${f}")" && sha256sum "$(basename "${f}")")
          done > "${sums_dir}/SHA256SUMS"
          cat "${sums_dir}/SHA256SUMS"
          files+=("${sums_dir}/SHA256SUMS")
          ss="without ScreenScraper support"
          if [[ "${SCREENSCRAPER}" == 1 ]]; then ss="with ScreenScraper support"; fi
          gh release create "${TAG}" --repo "${REPO}" --target "${GITHUB_SHA}" \
            --title "retrobox-emulationstation ${STAMP} (${SHA:0:7})" \
            --notes "batocera-emulationstation master @ \`${SHA}\` (commit of ${STAMP} UTC) with the patches in \`patches/\` applied. Built for ${DISTROS}, each for amd64 (x86_64) and arm64 (aarch64). Built ${ss}. Pick the file for your distribution and CPU: the architecture is at the end of the file name." \
            "${files[@]}"

  # When the scheduled run fails (typically a patch that no longer applies to
  # upstream), open an issue once instead of failing silently.
  notify:
    needs: [resolve, build, test]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create upstream-drift --repo "${REPO}" --color B60205 \
            --description 'Scheduled build failed' >/dev/null 2>&1 || true
          if [[ -z "$(gh issue list --repo "${REPO}" --label upstream-drift --state open --json number --jq '.[0].number')" ]]; then
            gh issue create --repo "${REPO}" --label upstream-drift \
              --title 'Scheduled build failed (upstream drift?)' \
              --body "The scheduled build failed. Most likely a patch no longer applies to upstream master: see ${RUN_URL}"
          fi
